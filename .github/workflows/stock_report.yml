name: 台股選股日報

# 每個交易日 17:53（台北）由 Claude Code Routine 準時觸發（workflow_dispatch），見 docs/ROUTINE.md。
# 21:07 的排程是備援：Routine 沒觸發成功或報告不完整時補發；已經發過（claude/report-history
# 分支有 sent.json）就直接結束。GitHub 的排程常延遲好幾個小時，所以準時靠 Routine，不靠 cron。

on:
  schedule:
    - cron: '7 13 * * 1-5'   # UTC 13:07 = 台灣 21:07，週一至週五
  workflow_dispatch:
    inputs:
      force:
        description: '已經發過也重發'
        type: boolean
        default: false

permissions:
  contents: write   # 把每日紀錄推到 claude/report-history 分支

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行每日流程
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          # 排程常延遲到半夜，用「台北時間減 6 小時」當報告日期，跨過午夜也還是當天的報告
          DATE=$(TZ=Asia/Taipei date -d '-6 hours' +%F)
          rc=0
          # 法人資料常比股價晚更新，最多等 20 分鐘；等不到就先發並標示不完整，21:07 再補發完整版
          python run_daily.py all --ai api --wait-minutes 20 --date "$DATE" $FORCE || rc=$?
          # 10 非交易日、11 已經發過（通常是 Routine 發的）、12 還沒收盤，都不算失敗
          if [ "$rc" = 10 ] || [ "$rc" = 11 ] || [ "$rc" = 12 ]; then exit 0; fi
          exit $rc

      - name: 上傳紀錄為 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_id }}
          path: |
            history/
            logs/
          if-no-files-found: warn
          retention-days: 30

      - name: 失敗時 Telegram 告警
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 台股選股日報（備援）執行失敗！請至 GitHub Actions 查看詳情：https://github.com/b19911225-lei/taiwan-stock-report/actions" \
            -d parse_mode="HTML"
