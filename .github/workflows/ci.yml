name: 測試

on:
  push:
    # 每日紀錄分支只有 JSON，不跑測試
    branches: [main, 'claude/**', '!claude/report-history']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 與備援 workflow 相同的環境（Python 3.11、requirements.txt 解出來的最新版）
          - python: '3.11'
            constraints: ''
          # 與 Routine 雲端主機相同的環境（Python 3.13、預裝的 pandas 3）
          - python: '3.13'
            constraints: ''
          # 本機舊安裝（pandas 2、numpy 1）
          - python: '3.11'
            constraints: '"pandas<3" "numpy<2"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - name: 安裝套件
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt ${{ matrix.constraints }}
      - name: 執行測試
        run: python -m pytest -q
