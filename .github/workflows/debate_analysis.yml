name: 台股多空辯證

on:
  schedule:
    - cron: '0 10 * * 1-5'   # UTC 10:00 = 台灣 18:00，週一至週五
  workflow_dispatch:           # 允許手動觸發

jobs:
  debate-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 執行多空辯證
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python debate_analysis.py

      - name: 上傳 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-report-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30

      - name: 失敗時 Telegram 告警
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 多空辯證分析執行失敗！請至 GitHub Actions 查看詳情：https://github.com/b19911225-lei/taiwan-stock-report/actions" \
            -d parse_mode="HTML"
